services:
  funkos:
    image: funkos
    build:
      context: ./Funkos
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    
  posgresql:
    image: postgres:16
    ports:
      - "5432:5432"
    container_name: postgres_funkos
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: FunkosDb
    volumes:
          - postgre-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready -U admin -d FunkosDb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
  postgre-data: